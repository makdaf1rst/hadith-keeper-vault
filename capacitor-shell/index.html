<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jāmiʿ al-Kāmil</title>
    <style>
      :root {
        --background: #fbf7f0;
        --foreground: #21432e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background);
        color: var(--foreground);
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
        padding: 24px;
      }
      main {
        max-width: 320px;
      }
      img {
        width: 120px;
        height: 120px;
        border-radius: 24px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 12px;
      }
      p {
        font-size: 1rem;
        line-height: 1.6;
        opacity: 0.8;
        margin-bottom: 24px;
      }
      button {
        font: inherit;
        font-size: 1rem;
        color: #fbf7f0;
        background: var(--foreground);
        border: none;
        border-radius: 10px;
        padding: 12px 24px;
        cursor: pointer;
      }
      button:active {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="Jāmiʿ al-Kāmil icon" />
      <h1>Jāmiʿ al-Kāmil</h1>
      <p>You appear to be offline. Reconnect to continue browsing the hadith library.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
