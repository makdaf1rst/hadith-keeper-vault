name: Apply Book 60 Bengali overrides once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-book60-overrides-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Merge verified overrides into Book 60 Bengali source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const basePath = 'public/content/bengali/book-60/hadiths.json';
          const overridePath = 'public/content/bengali/book-60/qc-overrides.json';

          const base = JSON.parse(fs.readFileSync(basePath, 'utf8'));
          const overrides = JSON.parse(fs.readFileSync(overridePath, 'utf8'));

          const keys = Object.keys(overrides);
          if (keys.length !== 221) {
            throw new Error(`Expected 221 override entries, found ${keys.length}`);
          }

          for (const key of keys) {
            if (!Object.prototype.hasOwnProperty.call(base, key)) {
              throw new Error(`Missing base hadith ${key}`);
            }
            if (Number(key) !== Number(overrides[key].hadith_number)) {
              throw new Error(`Hadith number mismatch for ${key}`);
            }
            base[key] = { ...base[key], ...overrides[key] };
          }

          for (const key of keys) {
            for (const [field, value] of Object.entries(overrides[key])) {
              if (JSON.stringify(base[key][field]) !== JSON.stringify(value)) {
                throw new Error(`Verification failed for hadith ${key}, field ${field}`);
              }
            }
          }

          fs.writeFileSync(basePath, JSON.stringify(base));
          console.log(`Applied and verified ${keys.length} Book 60 Bengali overrides.`);
          NODE

      - name: Commit only Book 60 Bengali source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/content/bengali/book-60/hadiths.json

          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi

          changed="$(git diff --cached --name-only)"
          test "$changed" = "public/content/bengali/book-60/hadiths.json" || {
            echo "Unexpected staged files:"
            echo "$changed"
            exit 1
          }

          git commit -m "Apply Book 60 Bengali QC overrides to source"
          git push origin main
